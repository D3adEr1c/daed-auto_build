name: Update Geo databases

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

env:
  # ================================
  # daed binary
  # ================================

  DAED_SOURCE_REPO: "D3adEr1c/daed-fc44"

  DAED_SOURCE_TAG: "v2.2.0"

  DAED_ASSET: "daed-linux-x86_64"

  DAED_VERSION: "2.2.0"

  DAED_RELEASE_BASE: "10"


jobs:
  update:
    name: Build updated RPM
    runs-on: ubuntu-latest

    container:
      image: fedora:44

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      # ============================================================
      # Environment
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          dnf install -y \
            git \
            curl \
            jq \
            gh \
            rpm \
            rpm-build \
            rpmdevtools \
            redhat-rpm-config \
            systemd-rpm-macros \
            findutils \
            coreutils

      - name: Checkout packaging repository
        uses: actions/checkout@v4


      # ============================================================
      # Detect newest GeoSite / GeoIP releases
      # ============================================================

      - name: Get latest GeoSite and GeoIP versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          echo "Querying GeoSite latest release..."

          SITE_JSON="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/v2fly/domain-list-community/releases/latest
          )"

          echo "Querying GeoIP latest release..."

          IP_JSON="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/v2fly/geoip/releases/latest
          )"

          SITE_TAG="$(jq -r '.tag_name' <<<"$SITE_JSON")"
          IP_TAG="$(jq -r '.tag_name' <<<"$IP_JSON")"

          if [[ -z "$SITE_TAG" || "$SITE_TAG" == "null" ]]; then
            echo "Failed to obtain GeoSite release tag"
            exit 1
          fi

          if [[ -z "$IP_TAG" || "$IP_TAG" == "null" ]]; then
            echo "Failed to obtain GeoIP release tag"
            exit 1
          fi

          RPM_RELEASE="${DAED_RELEASE_BASE}.SITE-${SITE_TAG}.IP-${IP_TAG}"
          RELEASE_TAG="data-${SITE_TAG}-${IP_TAG}"

          {
            echo "site_tag=$SITE_TAG"
            echo "ip_tag=$IP_TAG"
            echo "rpm_release=$RPM_RELEASE"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

          echo
          echo "GeoSite:     $SITE_TAG"
          echo "GeoIP:       $IP_TAG"
          echo "RPM release: $RPM_RELEASE"
          echo "Release tag: $RELEASE_TAG"


      # ============================================================
      # Do nothing if this combination already exists
      # ============================================================

      - name: Check whether release already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.versions.outputs.release_tag }}"

          if gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1; then

            echo "build=false" >> "$GITHUB_OUTPUT"
            echo
            echo "Release already exists:"
            echo "$TAG"
            echo
            echo "No database update detected."

          else

            echo "build=true" >> "$GITHUB_OUTPUT"
            echo
            echo "New database combination detected:"
            echo "$TAG"

          fi


      # ============================================================
      # RPM build tree
      # ============================================================

      - name: Prepare RPM build tree
        if: steps.existing.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rpmdev-setuptree

          mkdir -p "$HOME/rpmbuild/SOURCES"

          cp packaging/daed.service \
            "$HOME/rpmbuild/SOURCES/daed.service"

          cp LICENSE \
            "$HOME/rpmbuild/SOURCES/LICENSE"


      # ============================================================
      # Download pre-built daed from your source repository
      # ============================================================

      - name: Download daed binary
        if: steps.existing.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/daed-release
          cd /tmp/daed-release

          echo "Downloading:"
          echo "  repository: $DAED_SOURCE_REPO"
          echo "  release:    $DAED_SOURCE_TAG"
          echo "  asset:      $DAED_ASSET"

          gh release download "$DAED_SOURCE_TAG" \
            --repo "$DAED_SOURCE_REPO" \
            --pattern "$DAED_ASSET"

          test -f "$DAED_ASSET"

          install -Dm755 "$DAED_ASSET" \
            "$HOME/rpmbuild/SOURCES/daed"

          echo
          echo "Binary:"
          file "$HOME/rpmbuild/SOURCES/daed"


      # ============================================================
      # Download latest GeoSite
      # ============================================================

      - name: Download GeoSite
        if: steps.existing.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SITE_TAG="${{ steps.versions.outputs.site_tag }}"

          echo "Downloading GeoSite $SITE_TAG"

          curl -fL \
            "https://github.com/v2fly/domain-list-community/releases/download/${SITE_TAG}/dlc.dat" \
            -o "$HOME/rpmbuild/SOURCES/geosite.dat"

          test -s "$HOME/rpmbuild/SOURCES/geosite.dat"

          ls -lh "$HOME/rpmbuild/SOURCES/geosite.dat"


      # ============================================================
      # Download latest GeoIP
      # ============================================================

      - name: Download GeoIP
        if: steps.existing.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          IP_TAG="${{ steps.versions.outputs.ip_tag }}"

          echo "Downloading GeoIP $IP_TAG"

          curl -fL \
            "https://github.com/v2fly/geoip/releases/download/${IP_TAG}/geoip.dat" \
            -o "$HOME/rpmbuild/SOURCES/geoip.dat"

          test -s "$HOME/rpmbuild/SOURCES/geoip.dat"

          ls -lh "$HOME/rpmbuild/SOURCES/geoip.dat"


      # ============================================================
      # Build RPM
      # ============================================================

      - name: Build RPM
        if: steps.existing.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SITE_TAG="${{ steps.versions.outputs.site_tag }}"
          IP_TAG="${{ steps.versions.outputs.ip_tag }}"

          echo "Building:"
          echo "  daed:    $DAED_VERSION"
          echo "  GeoSite: $SITE_TAG"
          echo "  GeoIP:   $IP_TAG"

          rpmbuild -bb packaging/daed.spec \
            --define "_topdir $HOME/rpmbuild" \
            --define "daed_version $DAED_VERSION" \
            --define "release_base $DAED_RELEASE_BASE" \
            --define "site_tag $SITE_TAG" \
            --define "ip_tag $IP_TAG"


      # ============================================================
      # Find and inspect resulting RPM
      # ============================================================

      - name: Inspect RPM
        if: steps.existing.outputs.build == 'true'
        id: rpm
        shell: bash
        run: |
          set -euo pipefail

          RPM="$(
            find "$HOME/rpmbuild/RPMS" \
              -type f \
              -name 'daed-*.x86_64.rpm' \
              -print \
              -quit
          )"

          if [[ -z "$RPM" ]]; then
            echo "RPM not found"
            exit 1
          fi

          echo "rpm=$RPM" >> "$GITHUB_OUTPUT"
          echo "rpm_name=$(basename "$RPM")" >> "$GITHUB_OUTPUT"

          echo
          echo "Built RPM:"
          echo "$RPM"
          echo

          rpm -qip "$RPM"

          echo
          echo "Files:"
          rpm -qlp "$RPM"


      # ============================================================
      # Publish GitHub Release
      # ============================================================

      - name: Create GitHub Release
        if: steps.existing.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.versions.outputs.release_tag }}"
          SITE_TAG="${{ steps.versions.outputs.site_tag }}"
          IP_TAG="${{ steps.versions.outputs.ip_tag }}"
          RPM="${{ steps.rpm.outputs.rpm }}"
          RPM_NAME="${{ steps.rpm.outputs.rpm_name }}"

          cat > /tmp/release-notes.md <<EOF
          ## daed Fedora 44 package

          **daed:** ${DAED_VERSION}

          **GeoSite:** ${SITE_TAG}

          **GeoIP:** ${IP_TAG}

          **RPM:** \`${RPM_NAME}\`

          This package contains the pre-built daed binary together with the latest V2Fly GeoSite and GeoIP databases available when this release was created.
          EOF

          gh release create "$TAG" \
            "$RPM" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Geo data ${SITE_TAG} / ${IP_TAG}" \
            --notes-file /tmp/release-notes.md


      # ============================================================
      # Summary
      # ============================================================

      - name: Job summary
        if: steps.existing.outputs.build == 'true'
        shell: bash
        run: |
          {
            echo "## RPM published"
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| daed | \`${DAED_VERSION}\` |"
            echo "| GeoSite | \`${{ steps.versions.outputs.site_tag }}\` |"
            echo "| GeoIP | \`${{ steps.versions.outputs.ip_tag }}\` |"
            echo
            echo "Release:"
            echo "\`${{ steps.versions.outputs.release_tag }}\`"
            echo
            echo "RPM:"
            echo "\`${{ steps.rpm.outputs.rpm_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
